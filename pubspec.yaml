name: finchat_app
description: "Finchat AI - aplikasi keuangan offline-first dengan AI"
publish_to: 'none'
version: 4.1.6+7

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_secure_storage: 10.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  pdf: ^3.10.8
  printing: ^5.12.0
  speech_to_text: ^7.4.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
